name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/order-kitchen-workflow

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
